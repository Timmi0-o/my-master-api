# Reference coturn config.
# Runtime config is generated by docker-entrypoint.sh from env:
#   TURN_EXTERNAL_IP, TURN_USERNAME, TURN_PASSWORD, TURN_REALM

listening-port=3478
min-port=49160
max-port=49200
fingerprint
lt-cred-mech
# user=USERNAME:PASSWORD
# external-ip=PUBLIC_IPV4
# realm=my-crazy-master.ru
no-cli
no-multicast-peers
no-tls
no-dtls
log-file=stdout
simple-log
