services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: my-master-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: my_master_api
    ports:
      - '5442:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d my_master_api']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - my-master-network

  app:
    image: my-master-api-app:latest
    container_name: my-master-api-app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_PORT: ${APP_PORT}
      DATABASE_URL: postgresql://app:app@postgres:5432/my_master_api?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      APP_WEB_URL: ${APP_WEB_URL}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: ${MAIL_FROM}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      S3_USE_SSL: ${S3_USE_SSL}
    ports:
      - '${APP_PORT}:${APP_PORT}'
    networks:
      - my-master-network

  coturn:
    image: coturn/coturn:4.6.2
    container_name: my-master-coturn
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP}
      TURN_USERNAME: ${TURN_USERNAME}
      TURN_PASSWORD: ${TURN_PASSWORD}
      TURN_REALM: ${TURN_REALM:-my-crazy-master.ru}
    volumes:
      - ./deploy/coturn/docker-entrypoint.sh:/docker-entrypoint-custom.sh:ro
    entrypoint: ['/bin/sh', '/docker-entrypoint-custom.sh']
    ports:
      - '3478:3478'
      - '3478:3478/udp'
      - '49160-49200:49160-49200/udp'
    networks:
      - my-master-network

volumes:
  postgres_data:

networks:
  my-master-network:
    name: my-master-network
